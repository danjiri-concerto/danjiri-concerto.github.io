<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PROJECT EDGEWORTH のFAQ。ルールやプロジェクトカード・衛星カードの効果に関するよくある質問を、カード番号・カード名で検索できます。">
    <title>PROJECT EDGEWORTH FAQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/images/logos/danjiri.png" type="image/png">
    <script src="/loadHtml.js"></script>
    <script src="/device-detection.js"></script>
</head>
<body class="page-edgeworth">
    <div id="navbar-placeholder"></div>

    <section id="hero-edgeworth" class="page-hero pe-faq-hero">
        <div class="hero-lore">
            <p class="hero-lore-eyebrow">PROJECT EDGEWORTH</p>
            <h2 class="hero-lore-title">FAQ</h2>
            <div class="hero-lore-divider"></div>
            <p class="hero-lore-tagline">カード番号・カード名で検索できます</p>
        </div>
    </section>

    <section id="faq">
        <div class="content-container">
            <div class="pe-faq-controls">
                <input type="search" id="pe-faq-search" class="pe-faq-search"
                       placeholder="カード番号（例: P024）・カード名・キーワードで検索" aria-label="FAQを検索">
                <div class="pe-faq-filter" id="pe-faq-kind" role="group" aria-label="カードの種類で絞り込み"></div>
                <div class="pe-faq-filter" id="pe-faq-category" role="group" aria-label="カテゴリで絞り込み"></div>
            </div>
            <p class="pe-faq-count" id="pe-faq-count" aria-live="polite"></p>
            <div id="pe-faq-list"></div>
            <p class="pe-faq-footnote">
                印刷物の訂正は<a href="/project-edgeworth/errata.html">エラッタページ</a>をご覧ください。
                ルール全体は<a href="https://www.dropbox.com/scl/fi/zinihtqju1uajx8xlkgoy/rulebook.pdf?rlkey=ls362jm5p178jg48bfjrjf8jy&dl=0" target="_blank" rel="noopener">ルールブック（PDF）</a>をご覧ください。
                解決しない場合は<a href="/contact.html">お問い合わせページ</a>、または <a href="https://x.com/danjiriconcerto">X（旧 Twitter）</a>の DM よりご連絡ください。
            </p>
        </div>
    </section>

    <!-- カード画像拡大モーダル -->
    <div class="pe-card-modal" id="pe-card-modal" hidden>
        <figure>
            <button type="button" class="pe-card-modal-close" aria-label="閉じる">×</button>
            <img id="pe-card-modal-img" src="" alt="">
            <figcaption id="pe-card-modal-caption"></figcaption>
        </figure>
    </div>

    <div id="footer-placeholder"></div>
    <script>
        loadHtml("footer-placeholder", "/footer.html");
    </script>
    <script>
    (function () {
        const IMG_DIR = '/images/project-edgeworth/cards_web/';
        const KINDS = [
            { key: 'all', label: 'すべて' },
            { key: 'none', label: 'ルール全般' },
            { key: 'crew', label: 'CREW' },
            { key: 'device', label: 'DEVICE' },
            { key: 'software', label: 'SOFTWARE' },
            { key: 'satellite', label: '衛星' },
            { key: 'other', label: '褒賞・ミッション・アクション' },
        ];
        const KIND_GROUP = { award: 'other', mission: 'other', action: 'other' };

        const state = { query: '', kind: 'all', category: 'all' };
        let cards = {};
        let faqs = [];

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const normalize = (s) => String(s).normalize('NFKC').toLowerCase();

        function kindsOf(faq) {
            if (!faq.main.length) return new Set(['none']);
            return new Set(faq.main.concat(faq.sub).map((id) => {
                const k = cards[id] ? cards[id].kind : 'other';
                return KIND_GROUP[k] || k;
            }));
        }

        function cardThumb(id, isMain) {
            const c = cards[id] || { name: id };
            return `<button type="button" class="pe-card ${isMain ? 'pe-card-main' : 'pe-card-sub'}" data-card="${esc(id)}">
                <img src="${IMG_DIR}${esc(id)}.webp" alt="${esc(id)} ${esc(c.name)}" loading="lazy">
                <span>${esc(id)}<br>${esc(c.name)}</span>
            </button>`;
        }

        function renderItem(faq) {
            let cardsHtml = '';
            if (faq.main.length) {
                cardsHtml += `<div class="pe-card-row">${faq.main.map((id) => cardThumb(id, true)).join('')}</div>`;
            }
            if (faq.sub.length) {
                cardsHtml += `<p class="pe-card-sub-label">類似・関連カード</p>
                    <div class="pe-card-row">${faq.sub.map((id) => cardThumb(id, false)).join('')}</div>`;
            }
            return `<article class="faq-item pe-faq-item">
                <div class="pe-faq-meta">
                    <span class="pe-faq-tag">${esc(faq.category)}</span>
                    ${faq.unconfirmed ? '<span class="pe-faq-tag pe-faq-tag-warn">要確認</span>' : ''}
                </div>
                <p class="question">Q. ${esc(faq.question)}</p>
                <p class="pe-faq-answer">A. ${esc(faq.answer)}</p>
                ${cardsHtml}
            </article>`;
        }

        function matches(faq) {
            if (state.category !== 'all' && faq.category !== state.category) return false;
            if (state.kind !== 'all' && !faq.kinds.has(state.kind)) return false;
            if (!state.query) return true;
            return normalize(state.query).split(/\s+/).filter(Boolean).every((w) => faq.haystack.includes(w));
        }

        function render() {
            const hits = faqs.filter(matches);
            $('pe-faq-list').innerHTML = hits.length
                ? hits.map(renderItem).join('')
                : '<p class="pe-faq-empty">該当するFAQが見つかりませんでした。</p>';
            $('pe-faq-count').textContent = `${hits.length} / ${faqs.length} 件`;
        }

        function renderChips(containerId, items, stateKey) {
            const el = $(containerId);
            el.innerHTML = items.map((it) =>
                `<button type="button" class="pe-chip" data-value="${esc(it.key)}" aria-pressed="${state[stateKey] === it.key}">${esc(it.label)}</button>`
            ).join('');
            el.addEventListener('click', (e) => {
                const btn = e.target.closest('.pe-chip');
                if (!btn) return;
                state[stateKey] = btn.dataset.value;
                el.querySelectorAll('.pe-chip').forEach((b) => b.setAttribute('aria-pressed', b === btn));
                render();
            });
        }

        function openModal(id) {
            const c = cards[id] || { name: '' };
            const img = $('pe-card-modal-img');
            img.src = IMG_DIR + id + '.webp';
            img.alt = `${id} ${c.name}`;
            img.classList.toggle('is-landscape', /^R/.test(id));
            $('pe-card-modal-caption').textContent = `${id}　${c.name}`;
            $('pe-card-modal').hidden = false;
        }

        function closeModal() {
            $('pe-card-modal').hidden = true;
        }

        async function init() {
            const res = await fetch('./data/faq.json');
            if (!res.ok) {
                $('pe-faq-list').innerHTML = '<p class="pe-faq-empty">FAQの読み込みに失敗しました。</p>';
                return;
            }
            const data = await res.json();
            cards = data.cards;
            faqs = data.faqs
                .map((f, i) => ({ ...f, order: i }))
                .sort((a, b) => (a.main.length ? 1 : 0) - (b.main.length ? 1 : 0) || a.order - b.order);
            faqs.forEach((f) => {
                f.kinds = kindsOf(f);
                const names = f.main.concat(f.sub).map((id) => `${id} ${cards[id] ? cards[id].name : ''}`);
                f.haystack = normalize([f.question, f.answer, f.category].concat(names).join(' '));
            });

            const categories = [...new Set(faqs.map((f) => f.category))];
            renderChips('pe-faq-kind', KINDS, 'kind');
            renderChips('pe-faq-category', [{ key: 'all', label: '全カテゴリ' }].concat(categories.map((c) => ({ key: c, label: c }))), 'category');

            const q = new URLSearchParams(location.search).get('q');
            if (q) {
                state.query = q;
                $('pe-faq-search').value = q;
            }
            $('pe-faq-search').addEventListener('input', (e) => {
                state.query = e.target.value;
                render();
            });
            $('pe-faq-list').addEventListener('click', (e) => {
                const btn = e.target.closest('.pe-card');
                if (btn) openModal(btn.dataset.card);
            });
            $('pe-card-modal').addEventListener('click', closeModal);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
            render();
        }

        init();
    })();
    </script>
</body>
</html>
