<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="description" content="我廻る、故に我あり, I Revolve, Therefore I Am, FAQ">
    <title>MINIMUM JOURNEY FAQ</title>
    <link rel="icon" href="/images/logos/danjiri.png" type="/image/png">
    <script src="/loadHtml.js"></script>
    <script src="/device-detection.js"></script>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <section id="hero-revolve">
        <div class="hero-revolve-container">
            <h2>我廻る、故に我あり</h2>
            <p>我こそが第一人格！自我の境地に達せよ！</p>
        </div>
    </section>

    <div class="content-container">
        <h1>FAQ</h1>

        <!-- カテゴリフィルタ -->
        <div style="margin-bottom: 20px;">
            <label for="category-filter" style="margin-right: 10px;">カテゴリで絞り込み:</label>
            <select id="category-filter" style="padding: 5px 10px; font-size: 16px;">
                <option value="all">すべて</option>
            </select>
        </div>

        <!-- カード画像拡大モーダル -->
        <div id="card-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;" onclick="closeCardModal()">
            <div style="position:relative;">
                <button onclick="closeCardModal()" style="position:absolute;top:-40px;right:0;background:white;border:none;font-size:30px;width:40px;height:40px;border-radius:50%;cursor:pointer;line-height:40px;padding:0;">×</button>
                <img id="modal-card-image" src="" style="max-width:90vw;max-height:90vh;border-radius:8px;">
            </div>
        </div>

        <div id="faq-container">
            <script>
                async function loadFAQ() {
                    console.log('ステップ1: 読み込み開始');

                    console.log('ステップ2: fetch開始');
                    const res1 = await fetch('./data/faq.csv');
                    const res2 = await fetch('./data/card.csv');

                    if (!res1.ok || !res2.ok) {
                        console.error('エラー: 読み込み失敗');
                        return;
                    }

                    console.log('ステップ3: text変換開始');
                    const faqText = await res1.text();
                    const cardText = await res2.text();

                    console.log('ステップ4: パース開始');
                    const faqData = parseCSV(faqText);
                    const cardData = parseCSV(cardText);

                    console.log(`ステップ5: FAQ ${faqData.length}件、カード ${cardData.length}件`);

                    // カードIDから名前を取得するマップを作成
                    const cardMap = new Map();
                    cardData.forEach(row => {
                        if (row.card_id && row.id_name) {
                            cardMap.set(row.card_id, row.id_name);
                        }
                    });

                    console.log('ステップ6: カードマップ完了');

                    const container = document.getElementById('faq-container');
                    console.log('ステップ7: container取得:', container);

                    console.log('ステップ8: FAQループ開始（try/catch で詳細デバッグ）');

                    const clean = (s) => (s ?? '')
                    .replace(/\u200B/g, '')
                    .replace(/\uFEFF/g, '')
                    .replace(/\r/g, '')
                    .trim();

                    let count = 0;
                    let skipped = 0;
                    let errors = 0;

                    faqData.forEach((faq, idx) => {
                    try {
                        // まずそのレコードの素の状態をログ（先頭の数件だけ冗長に）
                        if (idx < 5) {
                        console.log(`[ROW ${idx+2}] raw:`, {
                            category: faq.category,
                            question: faq.question,
                            answer: faq.answer,
                            card_ids: faq.card_ids,
                            add_display_ids: faq.add_display_ids
                        });
                        }

                        const q = clean(faq.question);
                        const a = clean(faq.answer);

                        // ガードを一時的に弱める（原因特定のため空でも描画する）
                        const faqDiv = document.createElement('div');
                        faqDiv.className = 'faq-item';
                        faqDiv.setAttribute('data-category', clean(faq.category) || '');
                        faqDiv.style.marginBottom = '30px';
                        faqDiv.style.padding = '20px';
                        faqDiv.style.backgroundColor = '#f9f9f9';
                        faqDiv.style.borderRadius = '8px';

                        let html = '';

                        if (clean(faq.category)) {
                        html += `<div style="font-weight:bold;color:#666;margin-bottom:10px;">カテゴリ: ${clean(faq.category)}</div>`;
                        }

                        html += `<div style="font-weight:bold;font-size:1.1em;margin-bottom:10px;">Q. ${q || '<span style="color:#b00">[EMPTY]</span>'}</div>`;
                        html += `<div style="margin-bottom:15px;">A. ${a || '<span style="color:#b00">[EMPTY]</span>'}</div>`;

                        // ここで cardIds / imageIds の処理による例外可能性を切り分けるため、
                        // まずは無効化スイッチを用意（true ならスキップ）
                        const SKIP_CARDS_AND_IMAGES = false;

                        if (!SKIP_CARDS_AND_IMAGES) {
                        // card_ids と add_display_ids を統合して画像表示
                        const allImageIds = [];

                        if (clean(faq.card_ids)) {
                            const cardIds = clean(faq.card_ids).split(',').map(s => s.trim()).filter(Boolean);
                            // card_ids の画像も追加
                            allImageIds.push(...cardIds);
                        }

                        if (clean(faq.add_display_ids)) {
                            const imageIds = clean(faq.add_display_ids).split(',').map(s => s.trim()).filter(Boolean);
                            allImageIds.push(...imageIds);
                        }

                        // 統合した画像を表示
                        if (allImageIds.length) {
                            html += `<div style="margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;">`;
                            allImageIds.forEach(id => {
                                // IDが数字から始まる場合は縦長（63x88）、英字から始まる場合は横長（88x63）
                                const isVertical = /^\d/.test(id);
                                const width = isVertical ? 126 : 176;
                                const height = isVertical ? 176 : 126;
                                html += `<img src="/images/i-revolve-therefore-i-am/cards/${id}.png" alt="カード ${id}"
                                    style="width:${width}px;height:${height}px;border-radius:4px;cursor:pointer;"
                                    onclick="openCardModal('/images/i-revolve-therefore-i-am/cards/${id}.png', ${isVertical})">`;
                            });
                            html += `</div>`;
                        }
                        } else {
                        html += `<div style="margin-top:10px;color:#999">[カード/画像処理は一時停止中]</div>`;
                        }

                        faqDiv.innerHTML = html;
                        container.appendChild(faqDiv);

                        count++;
                    } catch (e) {
                        errors++;
                        console.error(`[ERROR] 行${idx+2} で例外`, e, 'レコード:', faq);
                    }
                    });

                    console.log(`ステップ9: 追加=${count}件 / エラー=${errors}件 / （カード画像処理停止:${false}）`);

                    console.log('container.children.length:', container.children.length);

                    // カテゴリ一覧を収集してドロップダウンに追加
                    const categories = new Set();
                    faqData.forEach(faq => {
                        const cat = clean(faq.category);
                        if (cat) {
                            // カンマ区切りの場合も対応
                            cat.split(',').forEach(c => {
                                const trimmed = c.trim();
                                if (trimmed) categories.add(trimmed);
                            });
                        }
                    });

                    const filterSelect = document.getElementById('category-filter');
                    Array.from(categories).sort().forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = cat;
                        filterSelect.appendChild(option);
                    });

                    // フィルタ変更時のイベントリスナー
                    filterSelect.addEventListener('change', function() {
                        const selectedCategory = this.value;
                        const allFaqItems = document.querySelectorAll('.faq-item');

                        allFaqItems.forEach(item => {
                            const itemCategory = item.getAttribute('data-category');

                            if (selectedCategory === 'all') {
                                item.classList.remove('is_hidden');
                            } else {
                                // カンマ区切りカテゴリに対応
                                const categories = itemCategory.split(',').map(c => c.trim());
                                if (categories.includes(selectedCategory)) {
                                    item.classList.remove('is_hidden');
                                } else {
                                    item.classList.add('is_hidden');
                                }
                            }
                        });
                    });
                    // console.log('container.innerHTML:', container.innerHTML);
                }

                // CSVパース関数
                function parseCSV(text) {
                    const lines = text.split('\n');
                    const headers = parseCSVLine(lines[0]).map(h => h.trim());
                    const data = [];

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;

                        const values = parseCSVLine(lines[i]);
                        const row = {};
                        headers.forEach((header, index) => {
                            row[header] = values[index] ? values[index].trim() : '';
                        });
                        data.push(row);
                    }

                    return data;
                }

                // CSV行をパース（ダブルクォートで囲まれたカンマを考慮）
                function parseCSVLine(line) {
                    const values = [];
                    let current = '';
                    let inQuotes = false;

                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        const nextChar = line[i + 1];

                        if (char === '"' && nextChar === '"' && inQuotes) {
                            // エスケープされたダブルクォート
                            current += '"';
                            i++; // 次の文字をスキップ
                        } else if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            values.push(current);
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current);

                    return values;
                }

                loadFAQ();
            </script>

            <script>
            // DEBUG①: loadFAQ実行後に、実際に何件描画されたか確認
            (async () => {
                // loadFAQは即時実行されているので、描画が走り終わるまでイベントループ1回分待機
                await new Promise(r => setTimeout(r, 0));

                const container = document.getElementById('faq-container');
                const items = container.querySelectorAll('.faq-item');

                console.log('描画された .faq-item 件数:', items.length);
                console.log('最初の .faq-item DOM:', items[0]);
            })();
            </script>

        </div>
    </div>
      

    <div id="footer-placeholder"></div> <!-- footer.html を挿入する場所 -->
    <script>
        // footer.html の読み込み
        loadHtml("footer-placeholder", "/footer.html");

        // カード画像モーダル関数
        function openCardModal(imageSrc, isVertical) {
            event.stopPropagation();
            const modal = document.getElementById('card-modal');
            const img = document.getElementById('modal-card-image');
            img.src = imageSrc;

            // 縦長か横長かに応じて最大サイズを調整
            if (isVertical) {
                img.style.maxWidth = '50vw';
                img.style.maxHeight = '90vh';
            } else {
                img.style.maxWidth = '90vw';
                img.style.maxHeight = '50vh';
            }

            modal.style.display = 'flex';
        }

        function closeCardModal() {
            document.getElementById('card-modal').style.display = 'none';
        }
    </script>
</body>
</html>
